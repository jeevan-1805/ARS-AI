<div class="disparity-page">

    <div class="disparity-header">
        <div class="disparity-title">Gender Fairness Analysis</div>
        <div class="disparity-subtitle">
            Selection-rate comparison across the screened candidates
        </div>
    </div>

    <div class="stats-grid">

        <div class="stat-card">
            <div class="stat-value">{TOTAL_CANDIDATES}</div>
            <div class="stat-label">Total Candidates</div>
        </div>

        <div class="stat-card stat-male">
            <div class="stat-value">{TOTAL_MALES}</div>
            <div class="stat-label">Male Candidates</div>
        </div>

        <div class="stat-card stat-female">
            <div class="stat-value">{TOTAL_FEMALES}</div>
            <div class="stat-label">Female Candidates</div>
        </div>

    </div>

</div>
