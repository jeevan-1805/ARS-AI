<div class="screening-page">

    <div class="screening-header">
        <div class="screening-title">Screening Results</div>
        <div class="screening-job-title">{JOB_TITLE}</div>
        <div class="screening-subtitle">{TOTAL_CANDIDATES} candidates screened</div>
    </div>

    <div class="summary-grid">

        <div class="summary-card summary-total">
            <div class="summary-value">{TOTAL_CANDIDATES}</div>
            <div class="summary-label">Total Candidates</div>
        </div>

        <div class="summary-card summary-passed">
            <div class="summary-value">{PASSED_COUNT}</div>
            <div class="summary-label">Passed</div>
        </div>

        <div class="summary-card summary-potential">
            <div class="summary-value">{POTENTIAL_COUNT}</div>
            <div class="summary-label">Potential</div>
        </div>

        <div class="summary-card summary-failed">
            <div class="summary-value">{FAILED_COUNT}</div>
            <div class="summary-label">Failed</div>
        </div>

    </div>

    <div class="candidates-section">
        <div class="section-title">Candidates</div>
        <div class="section-subtitle">Review the screening result of each candidate.</div>
        <div class="pass-threshold">Pass Threshold: <strong>46%</strong></div>
    </div>

</div>
